<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DownloadForge</title>
  <link rel="stylesheet" href="popup.css"/>
</head>
<body>

<!-- ══════════════════════════════════════════
     HEADER
══════════════════════════════════════════ -->
<header class="header">
  <div class="header-brand">
    <span class="header-logo">⬡</span>
    <span class="header-name">DownloadForge</span>
    <span class="header-by">by ObsidianLabs</span>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="btn-studio" title="Open Stream Studio (HLS/m3u8 Downloader)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
    </button>
    <button class="icon-btn" id="btn-rescan" title="Rescan page (Alt+R)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M3 21v-5h5"/>
      </svg>
    </button>
    <button class="icon-btn" id="btn-dashboard" title="Open dashboard">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
    </button>
  </div>
</header>

<!-- ══════════════════════════════════════════
     PAGE INFO BAR
══════════════════════════════════════════ -->
<div class="page-bar" id="page-bar">
  <span class="page-favicon" id="page-favicon"></span>
  <span class="page-domain" id="page-domain">—</span>
  <span class="page-scan-time" id="page-scan-time"></span>
</div>

<!-- ══════════════════════════════════════════
     SCANNING STATE
══════════════════════════════════════════ -->
<div class="state-panel" id="state-scanning" hidden>
  <div class="spinner"></div>
  <span class="state-text">Scanning page resources…</span>
</div>

<!-- ══════════════════════════════════════════
     EMPTY STATE
══════════════════════════════════════════ -->
<div class="state-panel" id="state-empty" hidden>
  <div class="state-icon">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
  </div>
  <span class="state-text">No downloadable resources found</span>
  <span class="state-sub">Play video or refresh the page to detect media</span>
</div>

<!-- ══════════════════════════════════════════
     ERROR STATE
══════════════════════════════════════════ -->
<div class="state-panel" id="state-error" hidden>
  <div class="state-icon">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
  </div>
  <span class="state-text" id="error-text">Scan failed</span>
  <button class="btn-text" id="btn-error-retry">Try again</button>
</div>

<!-- ══════════════════════════════════════════
     UNSUPPORTED PAGE STATE
══════════════════════════════════════════ -->
<div class="state-panel" id="state-unsupported" hidden>
  <div class="state-icon">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>
  </div>
  <span class="state-text">This page can't be scanned</span>
  <span class="state-sub">DownloadForge works on regular web pages only</span>
</div>

<!-- ══════════════════════════════════════════
     MAIN CONTENT (shown when results exist)
══════════════════════════════════════════ -->
<div id="main-content" hidden>

  <!-- Category filter tabs -->
  <div class="filter-bar" id="filter-bar" role="tablist">
    <button class="filter-tab active" data-cat="all" role="tab">All <span class="tab-count" id="count-all">0</span></button>
    <button class="filter-tab" data-cat="stream" role="tab" title="Streams (HLS/m3u8)">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg>
      <span class="tab-count" id="count-stream">0</span>
    </button>
    <button class="filter-tab" data-cat="video" role="tab" title="Videos (MP4/WebM)">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="2.18" ry="2.18"/><line x1="7" x2="7" y1="2" y2="22"/><line x1="17" x2="17" y1="2" y2="22"/><line x1="2" x2="22" y1="12" y2="12"/><line x1="2" x2="7" y1="7" y2="7"/><line x1="2" x2="7" y1="17" y2="17"/><line x1="17" x2="22" y1="17" y2="17"/><line x1="17" x2="22" y1="7" y2="7"/></svg>
      <span class="tab-count" id="count-video">0</span>
    </button>
    <button class="filter-tab" data-cat="audio" role="tab" title="Audio">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span class="tab-count" id="count-audio">0</span>
    </button>
    <button class="filter-tab" data-cat="image" role="tab" title="Images">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
      <span class="tab-count" id="count-image">0</span>
    </button>
    <button class="filter-tab" data-cat="document" role="tab" title="Documents">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
      <span class="tab-count" id="count-document">0</span>
    </button>
    <button class="filter-tab" data-cat="archive" role="tab" title="Archives">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
      <span class="tab-count" id="count-archive">0</span>
    </button>
  </div>

  <!-- Search + sort row -->
  <div class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input class="search-input" id="search-input" type="text" placeholder="Search filename, URL…" autocomplete="off" spellcheck="false"/>
      <button class="search-clear" id="search-clear" hidden>✕</button>
    </div>
    <select class="sort-select" id="sort-select" title="Sort by">
      <option value="type">Type</option>
      <option value="name">Name</option>
      <option value="domain">Domain</option>
      <option value="detected">Newest</option>
    </select>
  </div>

  <!-- Bulk action bar (shown when items selected) -->
  <div class="bulk-bar" id="bulk-bar" hidden>
    <span class="bulk-count" id="bulk-count">0 selected</span>
    <div class="bulk-actions">
      <button class="btn-bulk" id="btn-bulk-download">⬇ Download all</button>
      <button class="btn-bulk" id="btn-bulk-copy">⧉ Copy URLs</button>
      <button class="btn-bulk btn-bulk-cancel" id="btn-bulk-cancel">✕</button>
    </div>
  </div>

  <!-- Resource list -->
  <div class="resource-list" id="resource-list" role="list"></div>

  <!-- Footer -->
  <div class="popup-footer">
    <span class="footer-count" id="footer-count">0 resources</span>
    <button class="btn-text" id="btn-select-all">Select all</button>
  </div>

</div>

<!-- ══════════════════════════════════════════
     COMPANION BANNER (shown if detected)
══════════════════════════════════════════ -->
<div class="companion-banner" id="companion-banner" hidden>
  <span>🖥 Desktop app connected</span>
</div>

<!-- ══════════════════════════════════════════
     AD SLOT (dashboard only — NOT in popup)
     Ads are only shown in the full dashboard
     page, never in the popup. This keeps the
     popup clean and users happy.
══════════════════════════════════════════ -->

<script src="popup.js" type="module"></script>
</body>
</html>
